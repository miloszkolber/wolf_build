name: wolf
services:
  wolf:
    image: ghcr.io/miloszkolber/gate:d2f678bec2f5@sha256:cb14c151aabacd0e979951a94abcd9c05af67e79bbbe0e1b16deb7d9a5f0d401
    container_name: wolf
    restart: always
    network_mode: host
    user: "1000:1000"
    environment:
      GATE_PROFILE: port-handoff
      GATE_HOST: 0.0.0.0
      GATE_CONTAINER_NAME: wolf
      GATE_RUNTIME: wolf-runtime
      GATE_TCP_PORTS: 47984,47989,48010
      GATE_UDP_PORTS: 47999,48100,48200
      GATE_ACTIVITY_PREFIXES: wolf-,wolf_,wolf
      IDLE_TIMEOUT: 300
      STARTUP_TIMEOUT: 90
      CONNECTION_IDLE_TIMEOUT: 600
    group_add: ["${DOCKER_GID:?Set Docker socket group}"]
    read_only: true
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:rw"]
    healthcheck:
      test: ["CMD", "/app/gate", "--health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
  wolf-runtime:
    image: ${WOLF_IMAGE:?Select a tested Wolf candidate digest}
    container_name: wolf-runtime
    restart: "no"
    profiles: [runtime]
    network_mode: host
    environment:
      WOLF_RENDER_NODE: ${WOLF_RENDER_NODE:-/dev/dri/renderD128}
      WOLF_SESSION_IDLE_TIMEOUT: ${WOLF_SESSION_IDLE_TIMEOUT:-900}
    group_add: ["${RENDER_GID:?Set render device group}"]
    device_cgroup_rules:
      - "c 13:* rmw"
      - "c ${HIDRAW_MAJOR:?Read the hidraw major from the target kernel}:* rmw"
    devices:
      - "${DRI_CARD:-/dev/dri/card0}:${DRI_CARD:-/dev/dri/card0}"
      - "${WOLF_RENDER_NODE:-/dev/dri/renderD128}:${WOLF_RENDER_NODE:-/dev/dri/renderD128}"
      - /dev/uinput
      - /dev/uhid
    volumes:
      - ./state:/etc/wolf:rw
      - ./state/sockets:/run/user/wolf:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Hotplugged input/hidraw nodes must be visible after container creation.
      - /dev:/dev:rw
      - /run/udev:/run/udev:ro
    stop_grace_period: 45s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
