name: Retire Lutris artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  actions: write
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remove retired package and application artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          namespace=users
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.type')" = Organization ]; then namespace=orgs; fi
          gh api "$namespace/$OWNER/packages/container/wolf_heroic" --jq .name
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "app-image-lutris" or .name == "app-evidence-lutris") | .id' > retired-artifacts.txt
          while read -r artifact; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
          done < retired-artifacts.txt
          gh api --method DELETE "$namespace/$OWNER/packages/container/wolf_lutris"
