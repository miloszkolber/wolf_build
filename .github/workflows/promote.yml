name: Promote tested digest
run-name: Promote ${{ inputs.image }} (${{ inputs.digest }})
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image whose candidate passed automated checks
        type: choice
        options: [wolf_runtime, wolf_steam, wolf_lutris]
        default: wolf_runtime
      digest:
        description: Exact candidate image digest (sha256)
        type: string
        required: true
      evidence_url:
        description: Optional full-session acceptance JSON. Omit for operator-authorized testing latest.
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: promotion-${{ inputs.image }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    environment: intel-acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require protected approval and validate acceptance when supplied
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ inputs.digest }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
          IMAGE: ${{ inputs.image }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/intel-acceptance" > environment.json
          python3 - <<'PY'
          import json, os, urllib.request
          from scripts.promotion import validate
          env=json.load(open('environment.json'))
          if not any(r.get('type')=='required_reviewers' and r.get('reviewers') for r in env.get('protection_rules', [])):
              raise SystemExit('intel-acceptance must have required reviewers configured')
          url=os.environ['EVIDENCE_URL']
          if not url:
              print('Operator-authorized latest for testing; full session acceptance remains pending.')
              raise SystemExit(0)
          if not url.startswith('https://'):
              raise SystemExit('evidence URL must use HTTPS')
          with urllib.request.urlopen(url, timeout=30) as response:
              if not response.url.startswith('https://'): raise SystemExit('insecure evidence redirect')
              record=json.loads(response.read(1048577))
          validate(record,os.environ['DIGEST'],os.environ['IMAGE'])
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact candidate without rebuilding
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ inputs.digest }}
          IMAGE: ${{ inputs.image }}
        run: |
          case "$IMAGE" in wolf_runtime|wolf_steam|wolf_lutris) ;; *) exit 1 ;; esac
          image="ghcr.io/${OWNER,,}/$IMAGE"
          docker pull "$image@$DIGEST"
          case "$IMAGE" in
            wolf_runtime) docker run --rm --network none --entrypoint python3 "$image@$DIGEST" /app/check-runtime.py --static ;;
            wolf_steam) docker run --rm --network none --entrypoint /opt/app/check.sh "$image@$DIGEST" steam ;;
            wolf_lutris) docker run --rm --network none --entrypoint /opt/app/check.sh "$image@$DIGEST" lutris ;;
          esac
          docker save "$image@$DIGEST" -o promotion.tar
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.76.0 image --input /work/promotion.tar --severity HIGH,CRITICAL --exit-code 1
          registry_digest() {
            docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -er '.digest'
          }
          docker buildx imagetools inspect "$image@$DIGEST"
          # Establish digest-preserving retagging before touching latest.
          approved="$image:tested-${DIGEST#sha256:}"
          docker buildx imagetools create --prefer-index=false --tag "$approved" "$image@$DIGEST"
          staged="$(registry_digest "$approved")"
          test "$staged" = "$DIGEST"
          previous=''
          if registry_digest "$image:latest" > previous.txt 2> previous-error.txt; then
            previous="$(cat previous.txt)"
          elif ! grep -qiE 'not found|manifest unknown' previous-error.txt; then
            cat previous-error.txt >&2; exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image@$DIGEST"
          actual="$(registry_digest "$image:latest")"
          if [ "$actual" != "$DIGEST" ]; then
            if [ -n "$previous" ]; then
              docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image@$previous"
            fi
            echo 'Promotion digest mismatch' >&2; exit 1
          fi
          echo "Operator-promoted latest: $image@$DIGEST (not an implicit session acceptance)" >> "$GITHUB_STEP_SUMMARY"
