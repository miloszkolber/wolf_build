name: Application image
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: build (${{ inputs.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - name: Resolve current application inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
        run: |
          python3 scripts/resolve-apps.py --app "$APP"
          bash scripts/resolve-packages.sh "$APP"
          python3 scripts/lock-packages.py "$APP" > apps.json
          {
            echo "base=$(jq -r .inputs.base apps.json)"
            echo "input=$(jq -r .input_sha256 apps.json)"
            echo "tag=$(jq -r .tag apps.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse unchanged image, but repeat its checks and repair latest
        id: existing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          TAG: ${{ steps.inputs.outputs.tag }}
          INPUT: ${{ steps.inputs.outputs.input }}
        run: python3 scripts/publish.py check "wolf_$APP" "$TAG" "$INPUT" app-test:local
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        if: steps.existing.outputs.unchanged != 'true'
        with:
          context: .
          file: docker/apps.Dockerfile
          target: ${{ inputs.app }}
          platforms: linux/amd64
          load: true
          tags: app-test:local
          build-args: |
            BASE_IMAGE=${{ steps.inputs.outputs.base }}
            INPUT_SHA256=${{ steps.inputs.outputs.input }}
          cache-from: type=gha,scope=apps-${{ inputs.app }}
          cache-to: type=gha,scope=apps-${{ inputs.app }},mode=min,ignore-error=true
      - name: Check final payload and user setup without devices or network
        env:
          APP: ${{ inputs.app }}
        run: |
          docker run --rm --network none --entrypoint /opt/app/check.sh app-test:local "$APP"
          test "$(docker run --rm --network none -e PUID=1234 -e PGID=1235 app-test:local id -u)" = 1234
          if docker run --rm --network none -e PUID=00 app-test:local id -u; then exit 1; fi
          docker run --rm --network none app-test:local sh -ec 'test "$HOME" = /home/retro; test -w "$HOME"; test "$(id -u)" = 1000'
          bash scripts/test-app-session.sh app-test:local "$APP"
          bash scripts/test-app-audio.sh app-test:local
          docker image inspect app-test:local --format '{{.Size}}' > image-size.txt
          docker run --rm --network none --entrypoint cat app-test:local /licenses/distribution-packages.txt > packages.txt
          docker save app-test:local -o candidate.tar
      - name: SBOM and vulnerability assessment
        run: bash scripts/scan-image.sh candidate.tar
      - name: Save publication identity
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
        run: echo "$TAG" > tag.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: app-image-${{ inputs.app }}
          path: |
            candidate.tar
            tag.txt
            apps.json
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: app-evidence-${{ inputs.app }}
          path: |
            apps.json
            packages.txt
            image-size.txt
            candidate.cdx.json
            vulnerabilities.json
  publish:
    name: publish (${{ inputs.app }})
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-image-${{ inputs.app }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image and latest
        env:
          APP: ${{ inputs.app }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -i candidate.tar
          tag=$(cat tag.txt)
          expected=$(jq -r .input_sha256 apps.json)
          python3 scripts/publish.py publish "wolf_$APP" "$tag" "$expected" app-test:local
