name: Build applications
on:
  push:
    branches: [main]
    paths: ['.dockerignore', 'docker/apps.Dockerfile', 'docker/apps/**', 'docker/packages/**', 'scripts/*packages*', 'scripts/package-plan.sh', 'scripts/resolve-apps.py', 'scripts/test-app-session.sh', 'scripts/test-app-audio.sh', 'scripts/resolve.py', 'scripts/publish.py', 'scripts/scan-image.sh', 'tests/**', '.github/workflows/apps.yml', '.github/workflows/app.yml']
  pull_request:
    paths: ['.dockerignore', 'docker/apps.Dockerfile', 'docker/apps/**', 'docker/packages/**', 'scripts/*packages*', 'scripts/package-plan.sh', 'scripts/resolve-apps.py', 'scripts/test-app-session.sh', 'scripts/test-app-audio.sh', 'scripts/resolve.py', 'scripts/publish.py', 'scripts/scan-image.sh', 'tests/**', '.github/workflows/apps.yml', '.github/workflows/app.yml']
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  steam:
    uses: ./.github/workflows/app.yml
    with:
      app: steam
    permissions:
      contents: read
      packages: write
      actions: read
  heroic:
    uses: ./.github/workflows/app.yml
    with:
      app: heroic
    permissions:
      contents: read
      packages: write
      actions: read
