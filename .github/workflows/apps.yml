name: Build application candidates
on:
  push:
    branches: [main]
    paths: ['docker/apps.Dockerfile', 'docker/apps/**', 'scripts/resolve-apps.py', 'scripts/test-app-session.sh', 'scripts/resolve.py', 'tests/test_apps.py', '.github/workflows/apps.yml']
  pull_request:
    paths: ['docker/apps.Dockerfile', 'docker/apps/**', 'scripts/resolve-apps.py', 'scripts/test-app-session.sh', 'scripts/resolve.py', 'tests/test_apps.py', '.github/workflows/apps.yml']
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [steam, lutris]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - name: Resolve current application inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/resolve-apps.py > apps.json
          {
            echo "base=$(jq -r .inputs.base apps.json)"
            echo "refresh=$(jq -r .inputs.refresh apps.json)"
            echo "input=$(jq -r .input_sha256 apps.json)"
            echo "tag=$(jq -r .tag apps.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          file: docker/apps.Dockerfile
          target: ${{ matrix.app }}
          platforms: linux/amd64
          load: true
          tags: app-test:local
          build-args: |
            BASE_IMAGE=${{ steps.inputs.outputs.base }}
            REFRESH=${{ steps.inputs.outputs.refresh }}
            INPUT_SHA256=${{ steps.inputs.outputs.input }}
          cache-from: type=gha,scope=apps-${{ matrix.app }}
          cache-to: type=gha,scope=apps-${{ matrix.app }},mode=min,ignore-error=true
      - name: Check final payload and user setup without devices or network
        env:
          APP: ${{ matrix.app }}
        run: |
          docker run --rm --network none --entrypoint /opt/app/check.sh app-test:local "$APP"
          test "$(docker run --rm --network none -e PUID=1234 -e PGID=1235 app-test:local id -u)" = 1234
          if docker run --rm --network none -e PUID=00 app-test:local id -u; then exit 1; fi
          if [ "$APP" = lutris ]; then
            docker run --rm --network none -e PUID=1234 -e PGID=1235 app-test:local lutris --version
          fi
          docker run --rm --network none app-test:local sh -ec 'test "$HOME" = /home/retro; test -w "$HOME"; test "$(id -u)" = 1000'
          bash scripts/test-app-session.sh app-test:local "$APP"
          docker image inspect app-test:local --format '{{.Size}}' > image-size.txt
          docker run --rm --network none --entrypoint cat app-test:local /licenses/distribution-packages.txt > packages.txt
          docker save app-test:local -o candidate.tar
      - name: SBOM and vulnerability assessment
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.76.0 image --input /work/candidate.tar --format cyclonedx --output /work/candidate.cdx.json
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.76.0 image --input /work/candidate.tar --severity HIGH,CRITICAL --exit-code 1 --format json --output /work/vulnerabilities.json
      - name: Save publication identity
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
        run: echo "$TAG" > tag.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: app-image-${{ matrix.app }}
          path: |
            candidate.tar
            tag.txt
            apps.json
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: app-evidence-${{ matrix.app }}
          path: |
            apps.json
            packages.txt
            image-size.txt
            candidate.cdx.json
            vulnerabilities.json
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [steam, lutris]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-image-${{ matrix.app }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable candidate, never latest
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -i candidate.tar
          tag=$(cat tag.txt)
          [[ "$tag" =~ ^candidate-[a-f0-9]{16}$ ]]
          image="ghcr.io/${OWNER,,}/wolf_$APP:$tag"
          expected=$(jq -r .input_sha256 apps.json)
          owner_type=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.type')
          namespace=users
          if [ "$owner_type" = Organization ]; then namespace=orgs; fi
          package_exists=true
          if ! gh api "$namespace/$OWNER/packages/container/wolf_$APP" > /dev/null 2> package-error.txt; then
            grep -q '(HTTP 404)' package-error.txt || { cat package-error.txt >&2; exit 1; }
            package_exists=false
          fi
          if [ "$package_exists" = true ] && docker manifest inspect "$image" > /dev/null 2> registry-error.txt; then
            docker pull "$image"
            previous=$(docker image inspect "$image" --format '{{ index .Config.Labels "io.wolf-build.input-sha256" }}')
            test "$previous" = "$expected" || { echo 'Immutable candidate collision' >&2; exit 1; }
            echo 'Candidate already published; preserving its digest.'
          else
            if [ "$package_exists" = true ]; then
              grep -qiE 'not found|manifest unknown' registry-error.txt || { cat registry-error.txt >&2; exit 1; }
            fi
            docker tag app-test:local "$image"
            docker push "$image"
          fi
