name: Build runtime
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'AGENTS.md', 'openspec/**', 'docker/apps.Dockerfile', 'docker/apps/**', 'scripts/resolve-apps.py', 'scripts/test-app-session.sh', 'tests/test_apps.py', '.github/workflows/apps.yml', 'compose/apps.md']
  pull_request:
    paths-ignore: ['README.md', 'AGENTS.md', 'openspec/**', 'docker/apps.Dockerfile', 'docker/apps/**', 'scripts/resolve-apps.py', 'scripts/test-app-session.sh', 'tests/test_apps.py', '.github/workflows/apps.yml', 'compose/apps.md']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      wolf_sha:
        description: Optional exact Wolf commit (versioned image only, does not advance latest)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - run: python3 -m unittest discover -s tests
      - run: bun scripts/check-docs.mjs
      - run: OPENSPEC_TELEMETRY=0 bun x --bun @fission-ai/openspec@1.14.1 validate --all --strict
      - name: Compose syntax without starting containers
        run: docker compose --env-file compose/.env.example -f compose/docker-compose.yaml --profile runtime config --quiet
      - uses: docker://rhysd/actionlint:1.7.12
  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.inputs.outputs.tag }}
      input: ${{ steps.inputs.outputs.input }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/sources
          key: sources-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sources-${{ runner.os }}-
      - name: Resolve and acquire runtime inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          WOLF_SHA: ${{ inputs.wolf_sha }}
        run: |
          python3 scripts/resolve.py --lock --wolf-sha "$WOLF_SHA"
          bash scripts/resolve-packages.sh runtime
          python3 scripts/lock-packages.py runtime
          python3 scripts/build-inputs.py
          source .build/build.env
          {
            echo "base=$BASE_IMAGE"
            echo "rust=$RUST_IMAGE"
            echo "tag=$CANDIDATE_TAG"
            echo "input=$INPUT_SHA256"
            echo "wolf=$WOLF_SHA"
            echo "recipe=$RECIPE_REVISION"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse unchanged image, but repeat its checks and repair latest
        id: existing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.inputs.outputs.tag }}
          INPUT: ${{ steps.inputs.outputs.input }}
        run: python3 scripts/publish.py check wolf_runtime "$TAG" "$INPUT" wolf-test:local
      - name: Build changed inputs
        if: steps.existing.outputs.unchanged != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          file: docker/wolf.Dockerfile
          platforms: linux/amd64
          load: true
          tags: wolf-test:local
          build-args: |
            BASE_IMAGE=${{ steps.inputs.outputs.base }}
            RUST_IMAGE=${{ steps.inputs.outputs.rust }}
            INPUT_SHA256=${{ steps.inputs.outputs.input }}
            WOLF_SHA=${{ steps.inputs.outputs.wolf }}
            RECIPE_REVISION=${{ steps.inputs.outputs.recipe }}
          cache-from: type=gha,scope=wolf
          cache-to: type=gha,scope=wolf,mode=max,ignore-error=true
      - name: Verify final runtime without Docker authority or GPU
        run: |
          docker run --rm --network none --entrypoint python3 wolf-test:local /app/check-runtime.py --static
          bash scripts/test-runtime-supervision.sh wolf-test:local
      - name: Export checked image
        run: docker save wolf-test:local -o candidate.tar
      - name: SBOM and vulnerability assessment
        run: bash scripts/scan-image.sh candidate.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: publication-image
          path: candidate.tar
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-evidence
          include-hidden-files: true
          path: |
            .build/context/manifest.json
            candidate.cdx.json
            vulnerabilities.json
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-image
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ${{ inputs.wolf_sha == '' && 'Publish checked image and latest' || 'Publish exact-version candidate' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          INPUT: ${{ needs.build.outputs.input }}
          WOLF_SHA: ${{ inputs.wolf_sha }}
        run: |
          docker load -i candidate.tar
          args=()
          if [ -n "$WOLF_SHA" ]; then args+=(--candidate-only); fi
          python3 scripts/publish.py publish wolf_runtime "$TAG" "$INPUT" wolf-test:local "${args[@]}"
