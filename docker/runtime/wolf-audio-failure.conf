; Start listening before Pulse. Stop after Wolf and Pulse during normal shutdown.
[eventlistener:wolf-audio-failure]
command=python3 /app/wolf-audio-failure.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=5
autostart=true
autorestart=true
buffer_size=20
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
