; Stop a stream session whose Moonlight client has been gone longer than
; WOLF_SESSION_IDLE_TIMEOUT seconds. Starts after Wolf (priority 20) and is
; stopped before it on shutdown, so no stop request races teardown.
[program:wolf-session-idle]
command=python3 /app/wolf-session-idle.py
autostart=true
autorestart=true
startretries=3
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
